<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictaphone Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            color: #a0aec0;
            font-size: 1.1rem;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .battery-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .battery-icon {
            width: 30px;
            height: 15px;
            border: 2px solid #fff;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 5px;
            height: 9px;
            background: #fff;
            border-radius: 2px;
        }
        
        .battery-level {
            position: absolute;
            height: 100%;
            background: #4ade80;
            transition: width 0.3s ease;
        }
        
        .battery-low .battery-level {
            background: #f87171;
        }
        
        .battery-text {
            font-weight: 500;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .btn {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-record {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }
        
        .btn-play {
            background: linear-gradient(45deg, #00c853, #00e676);
        }
        
        .btn-delete {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }
        
        .btn-refresh {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn:disabled:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .status-indicator {
            width: 15px;
            height: 15px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            transition: background 0.3s ease;
        }
        
        .status-indicator.recording {
            background: #ff4d4d;
            box-shadow: 0 0 10px #ff4d4d;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }
        
        .status-container {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 1.1rem;
            min-height: 24px;
        }
        
        .status-text {
            color: #e2e8f0;
            font-weight: 500;
        }
        
        .status-error {
            color: #f87171;
        }
        
        .status-warning {
            color: #fbbf24;
        }
        
        .messages-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .message-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            border-left: 4px solid #4ade80;
        }
        
        .message-item:hover {
            transform: translateX(5px);
            background: rgba(0, 0, 0, 0.3);
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .message-id {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .message-duration {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .message-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .message-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .message-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .power-saving {
            background: rgba(255, 215, 0, 0.2);
            color: #fbbf24;
            padding: 8px 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.4);
        }
        
        .audio-player {
            width: 100%;
            margin-top: 10px;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #a0aec0;
        }
        
        .waveform-container {
            height: 50px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 25px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }
        
        .waveform {
            display: flex;
            height: 100%;
            align-items: flex-end;
            padding: 0 15px;
            gap: 2px;
        }
        
        .bar {
            flex: 1;
            background: #4ade80;
            border-radius: 2px;
            min-width: 3px;
            transition: height 0.1s ease;
        }
        
        .recording .bar {
            background: #ff4d4d;
        }
        
        .power-save-warning {
            background: rgba(255, 215, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Диктофон</h1>
            <p class="subtitle">Современный интерфейс для управления аудиозаписями</p>
        </header>
        
        <div class="dashboard">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Управление записью</div>
                    <div class="battery-container">
                        <div class="battery-icon">
                            <div class="battery-level" id="batteryLevel" style="width: 100%"></div>
                        </div>
                        <span class="battery-text" id="batteryText">100%</span>
                    </div>
                </div>
                
                <div class="power-save-warning" id="powerSaveWarning">
                    Режим энергосбережения активирован. Некоторые функции недоступны.
                </div>
                
                <div class="waveform-container">
                    <div class="waveform" id="waveform">
                        <!-- JS -->
                    </div>
                </div>
                
                <div class="status-container">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span class="status-text" id="statusText">Готов к записи</span>
                </div>
                
                <div class="controls">
                    <button class="btn btn-record" id="recordBtn">
                        <span>Начать запись</span>
                    </button>
                    <button class="btn btn-play" id="stopBtn" disabled>
                        <span>Остановить</span>
                    </button>
                </div>
            </div>
            
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Список записей</div>
                    <button class="btn btn-refresh" id="refreshBtn">
                        <span>Обновить</span>
                    </button>
                </div>
                
                <div class="messages-list" id="messagesList">
                    <div class="loading">Загрузка записей...</div>
                </div>
            </div>
        </div>
        
        <div class="power-saving" id="powerSavingMode" style="display: none;">
            Режим энергосбережения: функции записи и воспроизведения ограничены
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM elements
            const recordBtn = document.getElementById('recordBtn');
            const stopBtn = document.getElementById('stopBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const messagesList = document.getElementById('messagesList');
            const batteryLevel = document.getElementById('batteryLevel');
            const batteryText = document.getElementById('batteryText');
            const powerSavingMode = document.getElementById('powerSavingMode');
            const powerSaveWarning = document.getElementById('powerSaveWarning');
            const waveform = document.getElementById('waveform');
            
            // State variables
            let isRecording = false;
            let isPlaying = false;
            let currentPlaybackId = null;
            let currentPlaybackAudio = null;
            let isPowerSavingMode = false;
            let batteryLevelValue = 100;
            
            // Initialize waveform visualization
            for (let i = 0; i < 50; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${Math.random() * 20 + 10}%`;
                waveform.appendChild(bar);
            }
            
            // Base URL for API requests
            const API_BASE = 'http://localhost:5000';
            
            // Animate waveform bars
            const animateWaveform = () => {
                const bars = waveform.children;
                for (let i = 0; i < bars.length; i++) {
                    if (isRecording) {
                        bars[i].style.height = `${Math.random() * 80 + 20}%`;
                    } else {
                        bars[i].style.height = `${Math.random() * 20 + 10}%`;
                    }
                }
                requestAnimationFrame(() => {
                    if (isRecording || waveform.classList.contains('recording')) {
                        animateWaveform();
                    }
                });
            };
            
            // API functions
            const api = {
                async getMessages() {
                    try {
                        const response = await fetch(`${API_BASE}/messages`);
                        if (!response.ok) throw new Error('Ошибка при загрузке сообщений');
                        return await response.json();
                    } catch (error) {
                        console.error('Error fetching messages:', error);
                        showError('Не удалось загрузить список записей. Проверьте соединение с сервером.');
                        return [];
                    }
                },
                
                async startRecording() {
                    try {
                        const response = await fetch(`${API_BASE}/record/start`, {
                            method: 'POST'
                        });
                        const data = await response.json();
                        return data.status;
                    } catch (error) {
                        console.error('Error starting recording:', error);
                        return 'Ошибка при запуске записи';
                    }
                },
                
                async stopRecording() {
                    try {
                        const response = await fetch(`${API_BASE}/record/stop`, {
                            method: 'POST'
                        });
                        const data = await response.json();
                        return data.status;
                    } catch (error) {
                        console.error('Error stopping recording:', error);
                        return 'Ошибка при остановке записи';
                    }
                },
                
                async playMessage(id) {
                    try {
                        const response = await fetch(`${API_BASE}/play/${id}`, {
                            method: 'POST'
                        });
                        const data = await response.json();
                        return data.status;
                    } catch (error) {
                        console.error('Error playing message:', error);
                        return 'Ошибка при воспроизведении';
                    }
                },
                
                async deleteMessage(id) {
                    try {
                        const response = await fetch(`${API_BASE}/message/${id}`, {
                            method: 'DELETE'
                        });
                        const data = await response.json();
                        return data.status;
                    } catch (error) {
                        console.error('Error deleting message:', error);
                        return 'Ошибка при удалении записи';
                    }
                },
                
                async getBatteryStatus() {
                    try {
                        const response = await fetch(`${API_BASE}/battery`);
                        if (!response.ok) throw new Error('Ошибка при получении статуса батареи');
                        const data = await response.json();
                        return data.battery;
                    } catch (error) {
                        console.error('Error fetching battery status:', error);
                        return batteryLevelValue; // Return current value if error
                    }
                }
            };
            
            // UI update functions
            const updateBatteryDisplay = (level) => {
                batteryLevelValue = level;
                batteryLevel.style.width = `${level}%`;
                batteryText.textContent = `${level}%`;
                
                if (level <= 20) {
                    batteryLevel.style.background = '#f87171';
                    batteryLevel.parentElement.classList.add('battery-low');
                    powerSaveWarning.style.display = 'block';
                } else {
                    batteryLevel.style.background = '#4ade80';
                    batteryLevel.parentElement.classList.remove('battery-low');
                    powerSaveWarning.style.display = 'none';
                }
            };
            
            const showError = (message) => {
                statusText.textContent = message;
                statusText.className = 'status-text status-error';
                statusIndicator.className = 'status-indicator';
            };
            
            const showWarning = (message) => {
                statusText.textContent = message;
                statusText.className = 'status-text status-warning';
                statusIndicator.className = 'status-indicator';
            };
            
            const showSuccess = (message) => {
                statusText.textContent = message;
                statusText.className = 'status-text';
                statusIndicator.className = 'status-indicator';
            };
            
            const showRecordingStatus = () => {
                statusText.textContent = 'Идет запись...';
                statusText.className = 'status-text';
                statusIndicator.className = 'status-indicator recording';
                waveform.classList.add('recording');
                animateWaveform();
            };
            
            const updatePowerSavingMode = (isLowBattery) => {
                isPowerSavingMode = isLowBattery;
                powerSavingMode.style.display = isLowBattery ? 'block' : 'none';
                
                // Update button states based on power saving mode
                recordBtn.disabled = isLowBattery;
                if (isLowBattery) {
                    recordBtn.title = 'Запись недоступна в режиме энергосбережения';
                } else {
                    recordBtn.title = '';
                }
            };
            
            const renderMessages = (messages) => {
                if (messages.length === 0) {
                    messagesList.innerHTML = '<div class="loading">Нет сохраненных записей</div>';
                    return;
                }
                
                let html = '';
                messages.forEach(msg => {
                    html += `
                        <div class="message-item" data-id="${msg.id}">
                            <div class="message-header">
                                <span class="message-id">Запись #${msg.id}</span>
                                <span class="message-duration">${msg.duration} сек</span>
                            </div>
                            <div class="message-actions">
                                <button class="message-btn play-btn" data-id="${msg.id}">▶ Воспроизвести</button>
                                <button class="message-btn delete-btn" data-id="${msg.id}">🗑 Удалить</button>
                            </div>
                            <audio class="audio-player" controls></audio>
                        </div>
                    `;
                });
                messagesList.innerHTML = html;
                
                // Add event listeners to message buttons
                document.querySelectorAll('.play-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = parseInt(e.target.dataset.id);
                        if (isPowerSavingMode) {
                            showWarning('Воспроизведение недоступно в режиме энергосбережения');
                            return;
                        }
                        await playMessage(id);
                    });
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = parseInt(e.target.dataset.id);
                        await deleteMessage(id);
                    });
                });
            };
            
            // Main functionality
            const loadMessages = async () => {
                messagesList.innerHTML = '<div class="loading">Загрузка записей...</div>';
                const messages = await api.getMessages();
                renderMessages(messages);
            };
            
            const loadBatteryStatus = async () => {
                const level = await api.getBatteryStatus();
                updateBatteryDisplay(level);
                updatePowerSavingMode(level <= 20);
            };
            
            const startRecording = async () => {
                if (isPowerSavingMode) {
                    showWarning('Запись недоступна в режиме энергосбережения');
                    return;
                }
                
                const result = await api.startRecording();
                if (result.includes('началась')) {
                    isRecording = true;
                    recordBtn.textContent = 'Остановить запись';
                    stopBtn.disabled = false;
                    recordBtn.classList.add('btn-delete');
                    recordBtn.classList.remove('btn-record');
                    showRecordingStatus();
                } else {
                    showError(result);
                }
            };
            
            const stopRecording = async () => {
                if (!isRecording) return;
                
                const result = await api.stopRecording();
                if (result.includes('сохранена') || result.includes('завершена')) {
                    isRecording = false;
                    recordBtn.textContent = 'Начать запись';
                    stopBtn.disabled = true;
                    recordBtn.classList.add('btn-record');
                    recordBtn.classList.remove('btn-delete');
                    statusText.textContent = 'Запись остановлена';
                    waveform.classList.remove('recording');
                    
                    // Reload messages after recording
                    setTimeout(loadMessages, 500);
                } else {
                    showError(result);
                }
            };
            
            const playMessage = async (id) => {
                if (isPlaying && currentPlaybackId === id) {
                    // Stop current playback
                    if (currentPlaybackAudio) {
                        currentPlaybackAudio.pause();
                        currentPlaybackAudio = null;
                    }
                    isPlaying = false;
                    currentPlaybackId = null;
                    
                    // Update UI
                    document.querySelectorAll('.play-btn').forEach(btn => {
                        btn.innerHTML = '▶ Воспроизвести';
                    });
                    showSuccess('Воспроизведение остановлено');
                    return;
                }
                
                // Stop any previous playback
                if (currentPlaybackAudio) {
                    currentPlaybackAudio.pause();
                }
                
                // Start new playback
                const result = await api.playMessage(id);
                if (result.includes('Воспроизведение запрещено')) {
                    showWarning(result);
                    return;
                }
                
                if (result.includes('не найдено')) {
                    showError(result);
                    return;
                }
                
                if (result.includes('началось') || result.includes('воспроизведение')) {
                    // Find the message item and audio player
                    const messageItem = document.querySelector(`.message-item[data-id="${id}"]`);
                    if (!messageItem) return;
                    
                    const audioPlayer = messageItem.querySelector('.audio-player');
                    if (!audioPlayer) return;
                    
                    // Set the audio source (assuming files are served from /recordings)
                    audioPlayer.src = `/recordings/message_${id}.wav`;
                    
                    // Show the audio player
                    audioPlayer.style.display = 'block';
                    
                    // Start playback
                    try {
                        await audioPlayer.play();
                        isPlaying = true;
                        currentPlaybackId = id;
                        currentPlaybackAudio = audioPlayer;
                        
                        // Update button text
                        document.querySelectorAll('.play-btn').forEach(btn => {
                            if (parseInt(btn.dataset.id) === id) {
                                btn.innerHTML = '⏹ Остановить';
                            }
                        });
                        
                        showSuccess(`Воспроизведение записи #${id}`);
                        // Drain battery
                        setTimeout(loadBatteryStatus, 1000);
                    } catch (error) {
                        console.error('Error playing audio:', error);
                        showError('Ошибка при воспроизведении аудио');
                    }
                } else {
                    showError(result);
                }
            };
            
            const deleteMessage = async (id) => {
                if (confirm(`Вы уверены, что хотите удалить запись #${id}?`)) {
                    const result = await api.deleteMessage(id);
                    if (result.includes('удалена')) {
                        showSuccess(result);
                        loadMessages();
                    } else {
                        showError(result);
                    }
                }
            };
            
            // Event listeners
            recordBtn.addEventListener('click', () => {
                if (isRecording) {
                    stopRecording();
                } else {
                    startRecording();
                }
            });
            
            stopBtn.addEventListener('click', stopRecording);
            
            refreshBtn.addEventListener('click', () => {
                loadMessages();
                loadBatteryStatus();
                showSuccess('Данные обновлены');
            });
            
            // Initialize the app
            const init = async () => {
                try {
                    // Check if API is available
                    const response = await fetch(`${API_BASE}/battery`);
                    if (!response.ok) {
                        throw new Error('API недоступен');
                    }
                    
                    // Load initial data
                    await loadBatteryStatus();
                    await loadMessages();
                    
                    // Set up periodic updates
                    setInterval(loadBatteryStatus, 30000); // Update battery every 30 seconds
                    
                    showSuccess('Система готова к работе');
                } catch (error) {
                    console.error('Initialization error:', error);
                    showError('Не удалось подключиться к серверу. Запустите Python-приложение.');
                    recordBtn.disabled = true;
                    refreshBtn.disabled = true;
                }
            };
            
            // Start the application
            init();
        });
    </script>
</body>
</html>
